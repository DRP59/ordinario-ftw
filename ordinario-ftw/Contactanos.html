<main class="contenido">
  <h2>Deseas contactarnos? Ingresa tus datos en el siguiente formulario:</h2>
  <form onsubmit="enviarFormulario(event)">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" required>

    <label for="correo">Correo:</label>
    <input type="email" id="correo" required>

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" required></textarea>

    <label>Cual es tu Nivel académico?</label>
    <input type="radio" name="nivel" value="Licenciatura"> Licenciatura
    <input type="radio" name="nivel" value="Maestría"> Maestría

    <label>¿Deseas recibir actualizaciones?</label>
    <input type="checkbox" id="boletin"> Si

    <button type="submit">Enviar</button>
  </form>
  <p id="respuesta"></p>
</main>
